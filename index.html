<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바로가기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #fff;
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    h1 { margin: 0; }
    nav {
      display: flex;
      gap: 12px;
    }
    a {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      border-radius: 12px;
      transition: transform 0.1s, opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
    a:active { transform: scale(0.96); }
    .naver { background: #03c75a; }
    .daum { background: #1e90ff; }
    .google { background: #ea4335; }
  </style>
</head>
<body>
  <h1>바로가기</h1>
  <nav>
    <a class="naver" href="https://www.naver.com" target="_blank" rel="noopener noreferrer">네이버</a>
    <a class="daum" href="https://www.daum.net" target="_blank" rel="noopener noreferrer">다음</a>
    <a class="google" href="https://www.google.com" target="_blank" rel="noopener noreferrer">구글</a>
  </nav>
</body>
</html>
